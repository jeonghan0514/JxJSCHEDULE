<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 設定固定寬度為 1200px，讓手機開啟時整體自動等比例縮放適合螢幕 -->
  <meta name="viewport" content="width=1200, initial-scale=0.35, maximum-scale=2.0, user-scalable=yes">
  <title>정한X조슈아｜JxJ COMEBACK SCHEDULE</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sage: {
              50: '#F4F8F4',
              100: '#E5EFE5',
              200: '#C5DCC6',
              300: '#A3C9A8',
              400: '#81B287',
              500: '#6E9975',
              600: '#5C8363',
              700: '#47674D',
              800: '#37503C',
            },
            softred: {
              500: '#E06D53',
              600: '#D96B6B',
            }
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-6 min-h-screen">
  <div id="app" class="w-[1150px] mx-auto space-y-6">
    
    <!-- 頁首區塊 -->
    <header class="bg-white rounded-2xl overflow-hidden shadow-sm border border-sage-200">
      <div class="w-full h-48 bg-cover bg-center" style="background-image: url('./banner.jpg');"></div>
      <div class="p-5 flex justify-between items-center gap-4 border-t border-sage-100">
        <div class="flex items-center space-x-3.5">
          <img src="./logo.jpg" alt="Logo" class="w-12 h-12 rounded-xl shadow-sm border border-sage-200 object-cover">
          <div>
            <h1 class="text-2xl font-bold tracking-wide text-sage-800">정한X조슈아｜JxJ COMEBACK SCHEDULE</h1>
            <p class="text-slate-500 mt-0.5 text-sm font-medium">좋아하는 사람은 하염없이 기다리는 거야 💎</p>
          </div>
        </div>

        <!-- 純觀看標籤 -->
        <div class="bg-sage-50 border border-sage-200 px-4 py-2 rounded-xl text-sage-700 font-bold text-sm flex items-center gap-1.5">
          <span>💎</span> 克拉專用觀看頁
        </div>
      </div>
    </header>

    <!-- 回歸時間軸流水帳 (純觀看) -->
    <main class="space-y-4">
      
      <!-- 控制列 -->
      <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-sage-200 shadow-sm">
        <div class="flex items-center space-x-2">
          <span class="w-2.5 h-2.5 rounded-full bg-sage-600"></span>
          <h2 class="text-lg font-bold text-slate-700">정한X조슈아｜JxJ SCHEDULE</h2>
        </div>
      </div>

      <!-- 流水帳清單卡片 -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden divide-y divide-slate-100">
        
        <div v-if="groupedEvents.length === 0" class="p-12 text-center text-slate-400 text-sm">
          目前還沒有動態紀錄喔！
        </div>

        <!-- 依日期分組顯示 -->
        <template v-for="(group, gIdx) in groupedEvents" :key="group.dateKey">
          
          <!-- 月份分隔橫條 -->
          <div v-if="group.showMonthHeader" class="bg-sage-100/70 border-y border-sage-200/80 px-5 py-2 flex items-center justify-between">
            <span class="text-xs font-bold text-sage-800 tracking-wider flex items-center gap-1.5">
              <span>📅</span> {{ group.monthTitle }}
            </span>
            <span class="text-[11px] font-semibold text-sage-600 bg-white/70 px-2 py-0.5 rounded-full border border-sage-200">
              {{ group.monthEventCount }} 個行程動態
            </span>
          </div>

          <!-- 當日區塊 (完全緊湊垂直置中) -->
          <div :class="gIdx % 2 === 0 ? 'bg-white' : 'bg-sage-50/50'" class="flex flex-row items-center transition py-2.5">
            
            <!-- 左側日期欄 -->
            <div class="w-28 border-r border-slate-100/80 flex flex-col items-center justify-center text-center shrink-0 self-stretch">
              <div class="flex flex-col items-center justify-center gap-0.5 my-auto">
                <span class="text-2xl font-bold tracking-tight leading-none" :class="group.isHoliday ? 'text-softred-600' : 'text-slate-700'">{{ group.dayNum }}</span>
                <span class="text-[11px] font-bold uppercase tracking-wide" :class="group.isHoliday ? 'text-softred-500' : 'text-sage-600'">{{ group.weekDay }}</span>
              </div>
            </div>

            <!-- 右側當天時間列表 -->
            <div class="flex-1 divide-y divide-slate-200/60 px-3 space-y-2 my-auto">
              <div v-for="timeBlock in group.timeBlocks" :key="timeBlock.timeStr" class="flex items-center space-x-3 transition first:pt-0 pt-2">
                
                <!-- 小時置中標籤 -->
                <div class="w-11 shrink-0 text-left flex items-center">
                  <span v-if="timeBlock.isAllDay" class="text-[11px] font-bold bg-sage-200/80 text-sage-800 px-1.5 py-0.5 rounded leading-none">全天</span>
                  <span v-else class="text-xs font-mono font-bold text-slate-400 block leading-none">{{ timeBlock.timeStr }}</span>
                </div>

                <!-- 同一個小時內的多個行程項目 (淡綠色柔和虛線) -->
                <div class="flex-1 space-y-2 divide-y divide-dashed divide-sage-300/60">
                  <div v-for="item in timeBlock.items" :key="item.id" class="flex items-center justify-between first:pt-0 pt-2 group min-h-[22px]">
                    
                    <div class="flex items-center space-x-2 overflow-hidden leading-none">
                      <!-- 圓形 Logo 圖片標籤 (w-5 h-5 / 20px) -->
                      <div class="w-5 h-5 rounded-full overflow-hidden flex items-center justify-center shrink-0 border border-slate-200 shadow-2xs" :title="item.platform">
                        <img :src="getPlatformIcon(item.platform)" :alt="item.platform" class="w-full h-full object-cover" @error="handleImgError">
                      </div>

                      <!-- 全天標籤 -->
                      <span v-if="item.isAllDay" class="text-[10px] font-bold bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded shrink-0">ALL DAY</span>

                      <!-- 動態標題 -->
                      <a v-if="item.link" :href="item.link" target="_blank" rel="noopener noreferrer" 
                         class="text-sm font-medium text-slate-700 hover:text-sage-700 hover:underline truncate leading-none"
                         title="點擊前往連結">
                        <span v-html="renderCustomHighlight(item.title, item.highlight)"></span>
                      </a>
                      <span v-else class="text-sm font-medium text-slate-700 truncate leading-none" v-html="renderCustomHighlight(item.title, item.highlight)">
                      </span>
                    </div>

                  </div>
                </div>

              </div>
            </div>

          </div>

        </template>

      </div>

    </main>

  </div>

  <!-- Realtime Database 模組載入與 Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref as dbRef, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBSYT-iNksOHfbdG2BRlwJD8YRNmJ7tFys",
      authDomain: "jxjschedule.firebaseapp.com",
      databaseURL: "https://jxjschedule-default-rtdb.firebaseio.com",
      projectId: "jxjschedule",
      storageBucket: "jxjschedule.firebasestorage.app",
      messagingSenderId: "407766532126",
      appId: "1:407766532126:web:45742371eb7c1f00896e0f",
      measurementId: "G-XCCCGNBHZ3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        const events = ref([]);

        // 台灣國定假日對照表
        const holidaysMap = {
          '2026-01-01': true,
          '2026-02-15': true, '2026-02-16': true, '2026-02-17': true, '2026-02-18': true, '2026-02-19': true, '2026-02-20': true,
          '2026-02-27': true, '2026-02-28': true,
          '2026-04-03': true, '2026-04-04': true, '2026-04-05': true, '2026-04-06': true,
          '2026-05-01': true,
          '2026-06-19': true,
          '2026-09-25': true,
          '2026-09-28': true,
          '2026-10-09': true, '2026-10-10': true,
          '2026-10-25': true, '2026-10-26': true,
          '2026-12-25': true
        };

        const platformOptions = [
          { name: 'Instagram', icon: './IG.jpg' },
          { name: 'X', icon: './X.jpg' },
          { name: 'Weverse', icon: './WVS.jpg' },
          { name: 'Youtube', icon: './YT.png' },
          { name: 'Seventeen', icon: './logo.jpg' },
          { name: 'Japan', icon: './JPLogo.jpg' }
        ];

        const handleImgError = (e) => {
          if (e.target.src.includes('JPLogo.jpg')) {
            e.target.src = './JPLogo.png';
          } else if (e.target.src.includes('JPLogo.png')) {
            e.target.src = './logo.jpg';
          }
        };

        onMounted(() => {
          onValue(dbRef(db, 'events'), (snapshot) => {
            const data = snapshot.val();
            events.value = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
          });
        });

        // 手動輸入關鍵字渲染
        const renderCustomHighlight = (title, highlight) => {
          if (!title) return '';
          if (!highlight) return title;

          const trimmed = highlight.trim();
          if (!trimmed) return title;

          let colorStyle = 'color: #94A3B8; font-weight: bold;'; // 預設淺灰

          // 淨漢應援原色 Rose Quartz #F7CAC9
          if (['[정한]', '정한', '[JEONGHAN]', 'JEONGHAN'].includes(trimmed)) {
            colorStyle = 'color: #F7CAC9; font-weight: bold;';
          } 
          // 知秀應援原色 Serenity #92A8D1
          else if (['[조슈아]', '조슈아', '[JOSHUA]', 'JOSHUA'].includes(trimmed)) {
            colorStyle = 'color: #92A8D1; font-weight: bold;';
          }

          const escaped = trimmed.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const regex = new RegExp(`(${escaped})`, 'g');
          
          return title.replace(regex, `<span style="${colorStyle}">$1</span>`);
        };

        const getPlatformIcon = (platformName) => {
          const found = platformOptions.find(p => p.name === platformName);
          return found ? found.icon : './logo.jpg';
        };

        const groupedEvents = computed(() => {
          const dateGroups = {};
          
          const sorted = [...events.value].sort((a, b) => {
            const dateA = a.isAllDay ? `${a.dateOnly || a.date.split('T')[0]}T00:00` : a.date;
            const dateB = b.isAllDay ? `${b.dateOnly || b.date.split('T')[0]}T00:00` : b.date;
            
            if (dateA === dateB) {
              if (a.isAllDay) return -1;
              if (b.isAllDay) return 1;
              return 0;
            }
            return new Date(dateA) - new Date(dateB);
          });

          sorted.forEach(item => {
            let d;
            if (item.isAllDay) {
              const dStr = item.dateOnly || (item.date ? item.date.split('T')[0] : '');
              if (!dStr) return;
              d = new Date(`${dStr}T00:00:00`);
            } else {
              if (!item.date) return;
              d = new Date(item.date);
            }

            const dateKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const monthKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}`;
            const monthTitle = `${d.getFullYear()} 年 ${d.getMonth()+1} 月`;
            const dayNum = String(d.getDate()).padStart(2, '0');
            const weekDays = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const dayOfWeek = d.getDay();
            const weekDay = weekDays[dayOfWeek];
            
            const timeStr = item.isAllDay ? 'ALL_DAY' : `${String(d.getHours()).padStart(2, '0')}:00`;
            const isHoliday = (dayOfWeek === 0 || dayOfWeek === 6) || Boolean(holidaysMap[dateKey]);

            if (!dateGroups[dateKey]) {
              dateGroups[dateKey] = { dateKey, monthKey, monthTitle, dayNum, weekDay, isHoliday, timeMap: {}, totalCount: 0 };
            }

            if (!dateGroups[dateKey].timeMap[timeStr]) {
              dateGroups[dateKey].timeMap[timeStr] = [];
            }

            dateGroups[dateKey].timeMap[timeStr].push(item);
            dateGroups[dateKey].totalCount++;
          });

          let lastMonthKey = '';
          const result = [];

          Object.values(dateGroups).forEach(group => {
            const showMonthHeader = group.monthKey !== lastMonthKey;
            if (showMonthHeader) {
              lastMonthKey = group.monthKey;
            }

            const monthEventCount = sorted.filter(e => {
              const edStr = e.isAllDay ? e.dateOnly : e.date;
              if (!edStr) return false;
              const ed = new Date(edStr);
              return `${ed.getFullYear()}-${String(ed.getMonth()+1).padStart(2, '0')}` === group.monthKey;
            }).length;

            const timeBlocks = Object.keys(group.timeMap).map(timeStr => ({
              timeStr,
              isAllDay: timeStr === 'ALL_DAY',
              items: group.timeMap[timeStr]
            }));

            result.push({
              dateKey: group.dateKey,
              monthTitle: group.monthTitle,
              showMonthHeader,
              monthEventCount,
              dayNum: group.dayNum,
              weekDay: group.weekDay,
              isHoliday: group.isHoliday,
              timeBlocks
            });
          });

          return result;
        });

        return {
          events, groupedEvents, platformOptions, handleImgError, getPlatformIcon, renderCustomHighlight
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
